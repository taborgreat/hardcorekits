# hardcorekits.com -> the Node site in http/ (port 8080).
#
# BOOTSTRAP config: HTTP only, no ssl_certificate lines, on purpose. nginx refuses to load
# a config that names a cert file which does not exist yet, which would block the certbot
# run that creates it. deploy/install.sh copies this in, then runs
#
#   certbot --nginx -d hardcorekits.com -d www.hardcorekits.com
#
# which rewrites this block in place (adds `listen 443 ssl` + the cert lines) and appends a
# port-80 block that 301s to https. The proxy settings below carry into the TLS block.
#
# The plugin's own API (8085) is never exposed: browsers only ever reach the Node server,
# which polls the plugin on loopback and serves the cached answer.

server {
    server_name hardcorekits.com www.hardcorekits.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
