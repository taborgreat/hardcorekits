# hardcorepvp.com -> the Node site in http/ (port 8080). This is the main domain.
#
# BOOTSTRAP config: HTTP only, no ssl_certificate lines, on purpose. nginx refuses to load
# a config that names a cert file which does not exist yet, which would block the certbot
# run that creates it. deploy/install.sh copies this in, then runs
#
#   certbot --nginx -d hardcorepvp.com -d www.hardcorepvp.com --redirect
#
# which rewrites this block in place (adds `listen 443 ssl` + the cert lines) and appends a
# port-80 block that 301s to https. The proxy settings below carry into the TLS block.
#
# hardcorekits.com stays registered and keeps its own cert, but its site config is turned
# into a 301 to this domain by install.sh, so there is one canonical address for the web.
# The Minecraft server answers on both names regardless: that is DNS, not nginx.

server {
    server_name hardcorepvp.com www.hardcorepvp.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
