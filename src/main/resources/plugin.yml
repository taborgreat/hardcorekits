name: HardcoreGames
version: '${version}'
main: com.hardcorekits.HardcoreGames
api-version: '26.2'
description: Command driven Hardcore Games on a single natural terrain world.
author: taborgreat

commands:
  kit:
    description: Select your kit, or show the one you have.
    usage: /kit [name]
  kits:
    description: List available kits, one page at a time.
    usage: /kits [page]
  help:
    description: How the game and its commands work.
    usage: /help
  stats:
    description: Lifetime stats for yourself or another player.
    usage: /stats [player]
  msg:
    description: Whisper another player privately.
    usage: /msg <player> <message>
    aliases: [tell, whisper, w]
  feast:
    description: Where the feast is, once it has appeared.
    usage: /feast
  game:
    description: Match time and players remaining.
    usage: /game
  spawn:
    description: Back to the centre if you are stuck. Before the game starts only.
    usage: /spawn
  mod:
    description: Toggle mod mode, invisible and flying, outside the game. Staff only.
    usage: /mod
  mods:
    description: List staff, or appoint and dismiss roles below your own. Owners are ops.
    usage: /mods | mod <player> | trainee <player> | remove <player>
  ban:
    description: Swing the ban hammer (mods and owner), or propose a ban (trainees).
    usage: /ban <player> <reason...>
  pending:
    description: Open ban proposals, and every ban with who swung and why.
    usage: /pending
  propose:
    description: File a numbered ban proposal, or rule on one (mods and owner).
    usage: /propose ban <player> <reason...> | approve <id> | deny <id>
  hg:
    description: Admin control surface for the game loop.
    usage: /hg state | start [minutes] | hold | release | quickstart | skipinvuln | endgame | reset | fake
    permission: hardcoregames.admin
  announce:
    description: A server message to everyone, in red, exactly as typed.
    usage: /announce <message>
    permission: hardcoregames.admin

permissions:
  hardcoregames.admin:
    description: Access to admin/testing commands, and exemption from lobby restrictions.
    default: op
