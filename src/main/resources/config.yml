# Hardcore Games configuration.
# Everything the game needs to know about the map lives here — no coordinates in code.

# World the game runs in. There is no separate lobby world.
# Leave this blank to use whatever world the server booted into — which is what you want with
# fresh-world-on-restart below, since that hands the next boot a new world folder every time.
world: ''

# Map centre. Pre-game gathering point, the countdown teleport target, and the fixed frame
# everything else measures from: the border's ±500 edges, the feast's spawn radius, respawns.
# Y is resolved automatically to the surface.
center:
  x: 0
  z: 0
  # Relocation switches, both OFF since the no-oceans worldgen. They existed to drag the play
  # area off open sea, and with the whole map generating as land they only move the goalposts:
  # 0,0 stays the middle, always. Turn auto-land back on ONLY if worldgen.no-oceans is turned
  # off — a map centred on ocean is worse than a moved reference frame.
  auto-land: false
  prefer-swamp: false
  # How far to look for that land. Costs nothing to raise — the biome search does not
  # generate chunks.
  search-radius: 6000

# Players required before the countdown starts on its own — and required to KEEP counting:
# dropping below this mid-countdown cancels the start. 2 is the launch posture (you and one
# opponent make a match); raise it as the server grows. Do not drop this to 1 — a single
# join then silently starts a match. To test solo use /hg start, or /hg fake add <n>.
min-players: 2

# At this many participants the countdown collapses to the short fuse below — a full lobby
# should not stare at a five-minute clock. Raise as the server grows.
busy-players: 20
busy-countdown-seconds: 60

# Server slots. Applied at startup, overriding whatever server.properties says — that file is
# rewritten on shutdown for world rotation, so this is the one place worth changing.
max-players: 120

# The line shown under the server name in the multiplayer list. Same story as max-players:
# server.properties is not the authority here.
motd: 'Minecraft Hardcore Games'

# Seconds of countdown once the threshold is hit, when the lobby is below busy-players.
# Long on purpose: with a 2-player floor, the five minutes is the window for more people to
# wander in. Announced on the standard ladder: every minute, 30, 15, 10, then 5 down.
countdown-seconds: 300

# Grace period after the drop. Player-dealt damage is blocked; environment damage is not.
invulnerable-seconds: 120

# The map boundary. There is no wall and no vanilla border — you just take heavy damage
# outside it. Never shrinks.
border:
  # Full width of the play area, centred on `center`.
  # 1000 => playable from -500 to +500 on both x and z.
  size: 1000
  # Damage outside is graduated, so the edge warns before it kills.
  # The first stretch out is survivable: you notice, and you can walk back.
  grace-distance: 10
  # Damage per second inside that band. 1.0 = half a heart a second.
  grace-damage-per-second: 1.0
  # Past the band it climbs by this much per second, per further block — so 10 blocks beyond
  # the grace is 21 damage a second, and nobody sets up camp out there.
  ramp-per-block: 2.0
  # Ticks between damage applications. 10 = twice a second. Rates above are per second and
  # are scaled to this, so changing it alters the smoothness, not the lethality.
  damage-interval-ticks: 10
  # The hard stop. A real vanilla border stands this many blocks past the damage zone, so a
  # runner dying slowly outward cannot force the server to generate fresh terrain forever.
  # By the time anyone sees the red wall they are already deep in lethal damage.
  hard-wall-margin: 20
  # Inside the map but within this many blocks of the edge, that player's chat repeatedly
  # warns: the forcefield is nearby.
  forcefield-warning-distance: 25

# At match start everyone is teleported to a random point within this radius of centre...
scatter-radius: 50

# ...at this many blocks above the surface, then falls in.
drop-height: 20

# Seconds a disconnected player has to rejoin before they forfeit.
disconnect-grace-seconds: 60

# Disconnecting more times than this in one game forfeits immediately, with no reconnect
# window. Only counted once PvP is live — dropping out during invincibility does not count.
max-disconnects: 3

# Disconnecting within this many seconds of taking damage is treated as dying on the spot —
# no reconnect window — and whoever last hit you gets the kill.
combat-log-seconds: 3

# Compass refuses to lock on to anyone closer than this, so it cannot be used at knife range.
compass-min-distance: 25

# The build ceiling. Blocks cannot be placed above this Y, which stops the unreachable sky
# pillar without taking towering away — breaking line of sight, getting out of a melee and
# answering a Stomper are all still on.
#
# 140 sits above ordinary terrain and below the extremes. Sea level is 63, plains and forest
# run to about 90, and hills and windswept terrain to about 120 — so from anywhere you would
# normally fight, this is 30 to 70 blocks of headroom, which is more tower than anyone needs.
# What it does not clear is a jagged or frozen peak, which vanilla still generates well above
# it; standing on one of those you are already at the ceiling and cannot build higher. That is
# the right way round — high ground is an advantage you walk to, not one you carry dirt to.
#
# It is an absolute height rather than a height above the ground beneath you, because ground
# you have built on counts as ground: a relative limit is one you climb out of a block at a
# time.
#
# Admins are exempt, and it does not apply to blocks the plugin places itself (the feast, the
# End Game box).
build:
  max-height: 140

feast:
  # Minutes into the match when the chests appear.
  minutes: 22
  # Minutes into the match when the circle is built (5 minutes of warning by default).
  circle-minutes: 17
  # Radius of the grass circle. 15 gives a 30-wide clearing, placed in one tick.
  radius: 15
  # Chests placed in a ring around the enchanting table.
  chests: 12
  # How far from the middle of the map the feast may land, in blocks. The whole point of the
  # feast is pulling whoever is left back into one place, so it stays near the centre rather
  # than anywhere inside the border. Clamped to the border if this is set larger than the map.
  spawn-radius: 200

# The End Game. At sixty minutes the match ends whether the players have settled it or not:
# everyone still alive is sealed into a bedrock box in the sky and lava is poured in from the
# ceiling until there is nowhere left to stand. Nobody survives it, and that is the point — a
# match nobody is still playing otherwise holds the world open and blocks the next game.
endgame:
  # Minutes into the match when the box is built and everyone is teleported into it.
  minutes: 60
  # Minutes into the match when the warnings start. Same countdown ladder as everything else:
  # every whole minute, then 30/15/10, then every second from 5 down.
  warning-minutes: 55
  # Y of the box floor. Dropped automatically if the world is not tall enough for the ceiling.
  height: 180
  # Interior half-width. 10 gives a 21x21 floor; players arrive on a ring two blocks inside it.
  radius: 10
  # Interior height, floor to ceiling. Tall on purpose: the first layer of lava has thirty
  # blocks to fall, so it arrives as a ceiling opening up rather than as a floor that was
  # suddenly lava, and everyone gets to watch it come down.
  wall-height: 30
  # Seconds between arriving and the first lava landing, so the fight starts before the burning.
  pour-delay-seconds: 40
  # Seconds between each layer of lava, working down from the ceiling. There are wall-height
  # layers, so this and the height together set when the box is guaranteed full: 40 + 30*5 =
  # 190 seconds after everyone lands. That last moment kills whatever is still standing
  # outright — fire immunity does not outlast the End Game — so it wants to stay minutes away,
  # not tens of minutes. The room turns lethal long before then: the first layer alone pours
  # down every column and floods the floor.
  pour-interval-seconds: 5
  # Seconds of immunity on arrival, so nobody is killed mid-teleport before they can react.
  arrival-immunity-seconds: 3

# Elimination lines with a story to tell. {victim} and {killer} are filled in, colour is the
# kill blue like every other elimination, and "x players remaining." follows on its own.
messages:
  # Someone logged out while an attacker was still on them. The attacker gets the kill.
  combat-log-kill: "{victim} logged out to escape {killer}, and lost anyway."
  # Same, but nobody had hit them recently enough to be credited.
  combat-log: "{victim} logged out mid fight and was eliminated."

# Combat is rolled back to 1.8 as far as the server side can take it. The attack-speed cap is
# already gone (the recharge is made instant when a player is prepared), and these cover the
# rest of what 1.9 changed and people still fight around.
combat:
  # 1.9 sweep attacks. Off, so a swing hits what you aimed at and nothing else.
  disable-sweep: true
  # 1.9 added "not sprinting" to the critical-hit test, which killed the sprint-jump crit.
  sprint-crits: true
  # 1.9 put a cooldown on ender pearls. 1.8 did not.
  no-pearl-cooldown: true
  # A hit never breaks your sprint. Vanilla drops the attacker's sprint after every knockback
  # hit and leaves it to the client to pick it back up, which is the modern "w-tap" dance;
  # classic servers put the sprint straight back so you could keep running through a combo.
  keep-sprint: true
  # Shields are a 1.9 item: the recipe is removed and one cannot be raised.
  disable-shields: true
  # Seconds between natural heals — the 1.8 rate. 1.9 heals about a heart a second off
  # saturation, which makes food better than soup. 0 leaves modern regeneration alone.
  regen-interval-seconds: 4
  knockback:
    # 1.8 melee knockback. false keeps whatever the current version does.
    #
    # The 1.8 formula, applied the 1.8 way: each hit halves the victim's existing motion and
    # adds the shove (that decay is what makes combos chain instead of compounding), the lift
    # is capped at vertical-limit, and the sprint/enchant bonus is a separate addition along
    # the attacker's facing, applied once.
    enabled: true
    # Straight-line push away from the attacker.
    horizontal: 0.4
    # Lift. 1.9 only lifts a victim standing on the ground; 1.8 lifted them every hit, which
    # is most of why combos feel different.
    vertical: 0.4
    vertical-limit: 0.4
    # Added per knockback level along the attacker's facing, where sprinting is worth a level.
    # 1.8's number, and play-tested to feel right at exactly that.
    extra-horizontal: 0.5
    extra-vertical: 0.1

kits:
  barbarian:
    # Tyrfing tracks XP *earned*, never the XP bar being carried, so nothing a Barbarian does
    # with their XP can cost them an edge.
    # XP the first kill is worth, on top of whatever the corpse drops.
    kill-xp: 100
    # ...and every kill after the first is worth this much more than the last: 100, 200, 300.
    # Running totals by kill count:
    #   1 = 100, 2 = 300, 3 = 600, 4 = 1000, 5 = 1500, 6 = 2100, 7 = 2800, 8 = 3600,
    #   9 = 4500, 10 = 5500.
    kill-xp-step: 100
    # What a mob kill is worth. Seven mobs to a player kill is the intended exchange rate, so
    # this is kill-xp / 7 — hunting is a real way to grow the sword rather than a rounding
    # error, and a Barbarian who never finds a fight can still reach the feast holding iron.
    # The mob's own dropped XP lands on top of this, so in practice it is nearer six.
    #
    # It stays the slow lane by design, because player kills escalate and mobs do not: the
    # first kill is seven mobs, the fourth is nearer thirty.
    mob-kill-xp: 14
    # The ladder, cheapest rung first. `xp` is the running total of earned XP that buys the
    # rung, `material` is any sword, `sharpness` is optional. Reaching a rung reforges the
    # sword where it sits.
    #
    # Kills are what move this: one for stone, two for iron, four for diamond, six for the
    # first sharpness and eight for the second. Rungs sit just under the running total for
    # that kill, so grinding can shave one but never skip it.
    #
    # Hunting is the other route, at seven mobs to the kill: ~7 mobs for stone, ~21 for iron,
    # ~50 for diamond. Ore, bottles and furnaces count too — anything that would have gone in
    # the XP bar goes on the sword, and because it is the earned total rather than the bar,
    # spending the levels at the feast table costs nothing.
    tiers:
      - xp: 0
        material: WOODEN_SWORD
      - xp: 100
        material: STONE_SWORD
      - xp: 300
        material: IRON_SWORD
      - xp: 700
        material: DIAMOND_SWORD
      - xp: 2000
        material: DIAMOND_SWORD
        sharpness: 1
      - xp: 3400
        material: DIAMOND_SWORD
        sharpness: 2
      - xp: 5200
        material: DIAMOND_SWORD
        sharpness: 3
  digger:
    # Dragon eggs handed out at the start. Each one is one hole and then it is gone.
    eggs: 6
    # Ticks between placing the egg and the floor disappearing. 30 = a second and a half:
    # long enough that the egg is a fair warning, short enough to catch a chaser.
    fuse-ticks: 30
    # Half-width of the shaft. 2 gives the classic 5x5 footprint.
    radius: 2
    # How far down it goes. Deep enough that climbing out needs something to build with.
    depth: 8
  spy:
    # How close another player has to get before your compass warns you about them, in blocks.
    # Each person is announced once and stays quiet until they have properly left again.
    alert-radius: 40.0
    # How far you can read a player's kit by looking at them. Line of sight is required, and
    # players outside the server's view distance are not loaded for you at all — so this is
    # effectively "as far as you can actually see".
    look-range: 96.0
    # Ticks between radar sweeps: both the proximity warning and the look-at readout. 10 =
    # twice a second. The sweep only touches players who picked the kit.
    sweep-ticks: 10
  poseidon:
    # Melee damage multiplier while standing in water — the classic "160% strength", a shade
    # stronger than a Strength I potion. Only the attacker's own footing counts, and only for
    # swings: arrows are ordinary wherever they are fired from.
    water-damage-multiplier: 1.6
    # Strength worn while standing in water, purely so the buff is visible: the effect's own
    # damage is taken back out before the multiplier above is applied, so this changes the
    # icon and nothing else. 0 for no badge.
    water-strength-level: 1
    # Seconds of Slowness on leaving the water. Getting back in cancels it early, so the
    # penalty only ever applies on land.
    land-slowness-seconds: 5
    # 1 = Slowness I.
    land-slowness-level: 1
  fisherman:
    # Furthest the reel will pull from. A vanilla cast reaches about 33 blocks, so this is
    # effectively "as far as you can throw it" — past it the line snaps instead.
    max-distance: 32.0
    # Damage dealt by the hook connecting, before the pull. Small on purpose: it is feedback
    # and kill attribution, not the weapon. 1.0 = half a heart.
    hook-hit-damage: 1.0
    # Blocks the reel arcs above the victim before dropping them on you. Long pulls arc higher
    # than this on their own, and pulling someone up to you adds the climb. Flight time is
    # solved from the arc, so lower is a flatter, faster snap that terrain blocks more often.
    arc-height: 1.2
    # Seconds before the same victim can be reeled again, by anyone. Stops a Fisherman
    # juggling one player in the air forever; 0 restores the classic free-for-all.
    cooldown-seconds: 2
  demoman:
    # Blast strength of a mine. Vanilla TNT is 4.0.
    explosion-power: 4.0
    # Whether the blast craters the terrain, like real TNT.
    break-blocks: true
  turtle:
    # Caps, not fixed amounts — a hit weaker than this still only does what it would have.
    # Explosions and the border ignore the shell entirely; that is deliberate, not tunable.
    # 2.0 = one heart.
    crouch-damage: 2.0
    # ...and with a shield raised as well. 1.0 = half a heart.
    blocking-damage: 1.0
  tank:
    # Blast set off by a kill. 4.0 is vanilla TNT: anyone standing over the body when it goes
    # off is in real trouble. The Tank themselves never takes explosion damage.
    explosion-power: 4.0
    # On: a kill craters the ground the body fell on, TNT-sized at 4.0. The map ends up
    # pocked with holes, which is the point. The loot is protected either way — it is spawned
    # after the blast.
    break-blocks: true
  kaya:
    # Traps you start with. There is no cooldown — the limit is dirt and seeds, since a
    # crafting table turns those into more grass.
    starting-blocks: 8
  hermit:
    # Only used when the map has no swamp, jungle or desert at all. The biome search always
    # prefers the furthest match inside the border over this fallback.
    min-distance: 300
  thor:
    # Lightning always lands on the highest block of the clicked column — that is the
    # anti-tower mechanic, not a setting. Above this Y the strike also leaves burning
    # netherrack behind and shoves harder.
    high-strike-y: 80
    # Radius of the shove around the strike.
    radius: 4.0
    # Shove strength above and below the height threshold.
    high-power: 1.2
    low-power: 0.7
    # Striking your own netherrack again detonates it, at this fraction of TNT (4.0).
    netherrack-tnt-fraction: 0.5
    # Charges rather than a per-use timer: strike this many times in a burst, then rest.
    # That keeps the kit's answer to a tower or a rush immediate without it being a hose.
    uses: 3
    # Seconds of rest once those are spent. Trying to strike during it shows the time left.
    cooldown-seconds: 5
  pyro:
    # How hard a charge is thrown. The fireball is a blaze's, so this is the only thing
    # separating a lob over a wall from a shot across the feast.
    fireball-speed: 1.2
    # Blocks around the impact that catch. The direct hit is vanilla's and lands regardless;
    # this is the spread that makes a charge worth throwing at a group rather than a person.
    ignite-radius: 3.0
    # Seconds everything in that radius burns. The thrower is always left out of it.
    burn-seconds: 5
    # The landing detonates. 1.5 hurts and shoves without one-shotting anyone; TNT is 4.0
    # and at that strength a direct hit was a kill. Dropped loot survives it (game-wide rule).
    explosion-power: 1.5
    breaks-blocks: true
  viper:
    # Odds per landed hit on a player of applying Poison. Poison never kills — it stops at
    # half a heart — which is why it causes panic rather than deaths.
    poison-chance: 0.33
    poison-seconds: 5
  reaper:
    # Wither applied by every wooden-hoe hit. Unlike poison, wither CAN kill, and it blacks
    # out the victim's hearts so they cannot read their own health.
    wither-seconds: 5
  spiderman:
    # Snowballs thrown back-to-back before the cooldown. The snowballs themselves are
    # ordinary and replenishable — the burst is the only limit.
    burst: 3
    cooldown-seconds: 30
    # Speed level worn while standing in any cobweb. 4 (Speed IV), because a web crushes
    # movement AFTER speed is applied — Speed II in a web still feels like wading in glue.
    web-speed-level: 4
  vampire:
    # Health restored by kills. 6.0 = three hearts for a player, a sip for a mob.
    player-kill-heal: 6.0
    mob-kill-heal: 2.0
    # The earned vial: thrown, it heals the Vampire and hurts everyone else it wets.
    vial-heal: 4.0
    vial-damage: 2.0
    # A Vampire's chemistry runs backwards. This is the health moved by a full-strength
    # splash: harming heals them this much, healing hurts them this much.
    invert-amount: 4.0
  grappler:
    # Pull strength along the line. Lift is added on top, growing gently with distance.
    power: 1.6
    # Pulls back to back before the cooldown — air-lunges included, which is what keeps the
    # free-swing movement fun without making it flight.
    burst: 3
    cooldown-seconds: 3
    # Rod damage per pull. A rod holds 64 durability, so 4 is sixteen pulls before it snaps
    # and the Grappler needs to find a new rod — spam has a price, swinging is a resource.
    durability-per-pull: 4
  soulstealer:
    # The two windows: invisible seconds to touch someone, then seconds to finish them.
    hunt-seconds: 10
    kill-seconds: 10
    # The hunt swings at this fraction of normal damage — the second life is stolen from
    # behind, not won in a fair rematch.
    damage-multiplier: 0.4
  forger:
    # No numbers to tune: one coal always smelts one ore, instantly, in the inventory.
    # The 3 starting coal live in the kit; everything after that is mined or looted.
    enabled-note: 'iron, gold and copper, ores and raw forms alike'
  gambler:
    # Seconds between presses. Long enough that the button is a wager, not a slot machine
    # being fed until the diamonds come out.
    cooldown-seconds: 10
  gladiator:
    # Y of the Shadow Game floor, directly above wherever the challenge was thrown.
    height: 230
    # Seconds the box stays sealed bedrock. After this the walls and ceiling fall away and
    # jumping off becomes a legal answer.
    seal-seconds: 60
    # Seconds the winner gets to loot the body and heal before being returned below.
    loot-seconds: 15
    # The winner lands at a random spot within this range of the challenge point — never
    # exactly on it, to spite whoever is camping the return.
    return-radius: 50
    cooldown-seconds: 90
  monk:
    # Seconds between disarming touches. An empty hand never spends it.
    cooldown-seconds: 5
  hades:
    # Most minions one Hades can field at once. The iron ingot is a wand, not a cost, so
    # this cap is the whole limit on the army.
    max-minions: 5
  flash:
    # How far one flash can carry you. Weakness is 1 second per 2 blocks travelled, so range
    # prices itself.
    max-distance: 60
    # The classic 2:30, drawn on the torch and the XP bar.
    cooldown-seconds: 150
  snail:
    # Odds per landed hit — on players and mobs alike — of applying the slow.
    slow-chance: 0.33
    slowness-seconds: 5
    # 2 = Slowness II, the classic value.
    slowness-level: 2
  switcher:
    # Seconds between throws. The other limit is the ten balls themselves — ordinary
    # snowballs never become Switcher Balls, so every dodge spends the kit.
    cooldown-seconds: 10
  wisp:
    # Decoys per magma cream. Silent stand-ins in the Wisp's armour and name; they scatter,
    # never attack, and their deaths pay nothing.
    clones-per-cream: 5
    # Seconds a decoy wanders before removing itself, so spent creams do not haunt the map.
    clone-lifetime-seconds: 60
    # Dealt to whoever kills a decoy. 2.0 is the classic one heart.
    killer-damage: 2.0
  hulk:
    # Push along the line of sight when the Hulk lets go. 1.6 clears a good gap; raise it and
    # the throw starts reading as a launch rather than a shove.
    throw-power: 1.6
    # Upward part of the throw, so the victim arcs instead of skidding along the ground. This
    # is also what makes the fall damage on the far end worth anything.
    throw-lift: 0.6
    # Ceiling on that lift once the charge has multiplied it. Without one a full charge aimed
    # at the sky is 2.5x the lift straight up, and the fall alone kills: the throw is meant
    # to send people across the valley, not into orbit. 0.8 is a hard landing, not a fatal one.
    throw-lift-max: 0.8
    # Seconds after a throw before the same Hulk can pick someone up again. Without it a Hulk
    # can re-grab the instant they land and nobody ever touches the ground.
    cooldown-seconds: 5
    # Holding crouch while carrying winds the throw up; this is how many seconds of crouch
    # fill the bar. The charge shows on the XP bar's fill — the level number stays kills.
    charge-seconds: 2.0
    # Throw strength at a full bar, as a multiple of the uncharged throw. The wind-up is the
    # counterweight: a Hulk crouching with someone on their shoulders is telling the whole
    # fight what happens next. Scales the push; the lift is capped by throw-lift-max.
    charged-multiplier: 2.5
  cannibal:
    # Drumsticks gained per hit landed on another player. Hits on mobs deliberately give
    # nothing — feeding off a cow would make the kit's whole hunt-people premise optional.
    food-per-hit: 2
    # Saturation gained alongside it. Saturation is what stops the bar draining again, so
    # without some of this the food would leak straight back out.
    saturation-per-hit: 1.0
    # The Hunger left on whoever was hit. 30 seconds of Hunger I is exactly what a piece of
    # rotten flesh gives, which is the effect the kit is named after.
    hunger-seconds: 30
    hunger-level: 1
  berserker:
    # Blood Lust also blocks jumping for the same duration — that is the cost, not a setting.
    mob-kill:
      # 1 = Strength I.
      strength-level: 1
      seconds: 10
    player-kill:
      strength-level: 2
      seconds: 15
  anchor:
    # Blocks walked between iron footsteps. Lower is louder/more frequent.
    step-sound-distance: 2.5
    # How far the footstep carries. 1.0 is a normal-range sound.
    step-sound-volume: 1.0
  endermage:
    # Blocks out from the portal on each side, horizontally: 2 makes a 5x5 column. Height is
    # ignored, so anyone in that column is dragged in no matter how far above or below they
    # are — that is the anti-camping tool.
    reach: 2
    # Grace given to the Endermage and everyone dragged, so nobody arrives mid-swing.
    immunity-seconds: 5
    # Seconds before the portal returns to the inventory. Only one can be in play at a time.
    cooldown-seconds: 30
  ninja:
    # Seconds after landing a hit that you can still teleport to that player.
    mark-seconds: 10
    # Seconds between jumps. This is what stops the kit being a tether.
    cooldown-seconds: 7
  launcher:
    # Sponges in the starting kit.
    sponges: 20
    # Upward kick per sponge in the stack. A vanilla jump is about 0.42. 0.58 x a full
    # 5-stack is ~2.9, which peaks near 60 blocks — the intended ceiling.
    power: 0.58
    # Sponges past this one stop adding height, so a tower of them is not a rocket.
    max-stack: 5
    # Fraction of your falling speed a pad returns as bounce. 1.0 gives your fall straight
    # back (dropping onto a pad still bounces you), without the runaway growth >1.0 caused.
    restitution: 1.0
    # Sideways push when the pad is lopsided. OFF by default: it read as bouncing at weird
    # angles off ordinary flat pads. Your own running momentum carries through the bounce
    # instead, which is the direction control that actually feels right.
    sideways-power: 0.0
    # Seconds a launched player is owed a free landing.
    fall-immunity-seconds: 15
  jellyfish:
    # Seconds the conjured water lasts. Long enough to break a fall or douse a fire, short
    # enough that it never becomes terrain.
    duration-seconds: 3
    # Most conjured waters standing at once. They drain after a few seconds, so this is a
    # rate limit, not a budget. Placing against existing water is always refused — touching
    # sources breed permanent springs.
    max-active: 6
    # Seconds between one conjuring and the next, drawn on the XP bar. The cap above is the
    # flood stop; this is what stops the sea being poured out one click at a time.
    cooldown-seconds: 4
  cookiemonster:
    # Chance that breaking a patch of grass drops a cookie.
    grass-drop-chance: 0.2
    # Hunger one cookie restores. 2 is one drumstick, and this is spent first.
    food: 2
    # Health one cookie restores once hunger is full. 2.0 is one heart.
    heal: 2.0
    # Speed handed out when both bars are already full.
    speed-seconds: 5
    speed-level: 2
  timelord:
    # Blocks around the caster caught by the freeze.
    radius: 6.0
    # Seconds a frozen player stays rooted. They can still swing, and a hit releases them.
    duration-seconds: 10
    # Extra seconds before the watch can be cast again, on top of the freeze itself.
    cooldown-seconds: 30
  kangaroo:
    # Upward kick of the rocket. A vanilla jump is about 0.42; 1.0 clears most terrain.
    jump-power: 1.0
    # Push along your line of sight, so the hop travels rather than only rising.
    forward-power: 0.5
    # Seconds between hops. Drawn on the rocket itself as the vanilla cooldown sweep.
    cooldown-seconds: 5
    # Seconds of fall-damage immunity earned by landing a hit on another player.
    fall-immunity-seconds: 8
  jackhammer:
    # The column always runs upwards from the block broken — there is no aiming and no
    # downward mode, so nothing here selects a direction.
    # Columns the hammer can drill before it needs a rest.
    uses: 5
    # Seconds of cooldown once those are spent.
    cooldown-seconds: 30
    # Ticks between blocks in the column. 2 = ten blocks a second, which is fast enough to
    # matter in a fight and slow enough to watch coming.
    interval-ticks: 2
    # Whether the column drops its blocks, like ordinary mining.
    drop-blocks: true
  stomper:
    # Most fall damage the Stomper takes themselves. 4.0 = two hearts.
    fall-damage-cap: 4.0
    # How far the landing reaches, in blocks. Every victim in range takes their own hit,
    # judged only by their own distance: full fall damage on the block you land on, fading to
    # nothing at this distance. A crowd is not a discount — three people under you are hit
    # three times. Victims' armour reduces what they take; the Stomper's own armour never
    # weakens the hit.
    radius: 5.0
    # Most a crouching victim takes. 4.0 = two hearts.
    sneak-cap: 4.0

# Soup. Drinking is instant — no eat animation — and heals before it feeds.
soup:
  # Health restored while below full. 7.0 = three and a half hearts. Overflow is lost.
  heal: 7.0
  # Hunger restored instead, once health is already full. Vanilla stew is 6.
  food: 6
  # Saturation restored alongside the hunger. Capped at the hunger bar, as in vanilla.
  saturation: 7.2

# The winner's send-off, run in the ENDING state: they are made invulnerable and lifted onto a
# floating cake platform with fireworks going off around it, then everyone is kicked with the
# congratulations line and the server closes.
win:
  # Blocks above the winner the cake platform is built.
  platform-height: 25
  # How many times "<name> wins!" is repeated before the close.
  chants: 5
  # Seconds between each of those calls. The line wants room around it.
  chant-interval-seconds: 2
  # Seconds the winner is left on the podium after the last call, before everyone is kicked.
  close-delay-seconds: 5
  # Ticks between firework launches. 10 = twice a second.
  firework-interval-ticks: 10

# true  -> shut the JVM down after a win (clean slate, needs a wrapper script to relaunch)
# false -> in-place reset back to WAITING (faster for testing; keeps the same map)
restart-on-reset: true

# Every start retires the map it booted into: at enable the plugin points server.properties at
# a fresh world name, blanks the seed, and deletes the world the last run left behind. A running
# server cannot delete the world it is standing in, which is why the work is split across the
# restart. The decision is made at boot rather than at shutdown, so the next start gets new
# terrain however this run ends: a finished match, /stop, Ctrl+C, or a crash.
fresh-world-on-restart: true

# Read-only JSON API for the website (the Node app in http/). Serves /api/status,
# /api/kits, /api/stats?player=<name> and /api/stats/top.
web:
  enabled: true
  # Loopback on purpose: the Node app on the same machine is the audience. Only widen this if
  # the site runs on a different host, and firewall the port if you do.
  bind: 127.0.0.1
  port: 8085

worldgen:
  # Give each rotated world a small datapack that raises the continent floor above sea level,
  # so the map generates as land — swamps, forests, taigas, mountains, jungles, deserts,
  # meadows — instead of being mostly ocean. Rivers and lakes still generate; open sea does
  # not. Only newly GENERATED worlds are affected, so this rides the world rotation: the world
  # currently running keeps whatever terrain it was born with.
  no-oceans: true
  # Extra mushrooms planted per swamp chunk as chunks load — attempts, not a quota: only
  # shaded, valid spots take one, exactly where vanilla mushrooms survive. Soup is the healing
  # economy and the map is centred on a swamp, so the swamp should feed it. 0 turns it off.
  swamp-mushrooms-per-chunk: 6

# How long before invincibility ends the door closes on late joiners. People can connect and
# be dropped into a running match (kitless) right up to this cutoff; the buffer exists so
# nobody materialises into the world in the same breath PvP goes live.
late-join-cutoff-seconds: 5

# Flag-only anticheat. It never punishes and never cancels — every finding is one [STAFF]
# line for a human to judge. Two checks: melee reach and sustained mid-air hover.
watchdog:
  enabled: true
  # Eye-to-hitbox distance on a landed hit before it is flagged. Vanilla reach is ~3 blocks;
  # the slack above that is eaten by latency and hitbox edges. Do not tighten this below 5.
  max-reach: 5.2
  # Consecutive seconds of unsupported, non-falling hover before a flag. Kit movement
  # (Kangaroo, Launcher, Grappler) spends nearly all its arc falling, which resets the count.
  hover-seconds: 4

# Every chunk of the play area is generated up front at boot, while the lobby fills — so no
# player ever triggers terrain generation mid-match. Generated chunks persist on disk; the
# sweep covers the hard border wall plus margin-chunks beyond it. parallel is how many chunk
# generations run at once: higher finishes sooner but leans harder on the CPU during lobby.
pregen:
  enabled: true
  margin-chunks: 2
  parallel: 8
  # Pipeline width once a match is LIVE. The sweep works centre-out, so by the drop the
  # middle of the map is already baked; whatever rim is left fills in at this trickle,
  # yielding to the game instead of competing with it.
  parallel-during-match: 2

# Distances stamped onto the world at boot, because server.properties is rewritten on
# shutdown for world rotation. Client and tick load scale with the SQUARE of these.
# view-distance is chunks sent to each client; simulation-distance is chunks the server
# actually ticks around each player. 0 leaves the server default alone.
performance:
  view-distance: 8
  simulation-distance: 6
