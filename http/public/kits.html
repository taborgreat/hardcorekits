<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kits, Minecraft Hardcore Games</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
<main>
  <h1>Kits</h1>
  <nav><a href="/">Home</a><a href="/stats.html">Stats</a><a href="/kits.html">Kits</a><a href="/faq.html">FAQ</a></nav>

  <p>Pick one in game with <code>/kit &lt;name&gt;</code> before the countdown ends.</p>
  <div id="kits" class="panel">Loading…</div>

  <script>
    (async () => {
      const el = document.getElementById('kits');
      try {
        const kits = await (await fetch('/api/kits')).json();
        el.outerHTML = kits.map(k =>
          '<div class="kit-card"><div class="kit-name">' + k.name + '</div>'
          + '<div class="kit-desc">' + k.description + '</div></div>').join('');
      } catch {
        el.textContent = 'Could not load the kit list.';
      }
    })();
  </script>
</main>
</body>
</html>
