<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lifetime stats for a Minecraft Hardcore Games player." />
    <link rel="canonical" href="https://hardcorepvp.com/player.html" />
    <meta name="theme-color" content="#7fd06a" />
    <meta property="og:site_name" content="Minecraft Hardcore Games" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hardcorepvp.com/player.html" />
    <meta property="og:title" content="Minecraft Hardcore Games: Player" />
    <meta property="og:description" content="Lifetime stats for a Minecraft Hardcore Games player." />
    <meta property="og:image" content="https://hardcorepvp.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Minecraft Hardcore Games - hardcorepvp.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minecraft Hardcore Games: Player" />
    <meta name="twitter:description" content="Lifetime stats for a Minecraft Hardcore Games player." />
    <meta name="twitter:image" content="https://hardcorepvp.com/og.png" />
  <title>Minecraft Hardcore Games: Player</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/style.css?v=70">
</head>
<body class="swords">
<main>
  <p class="ip">IP: <code class="ip-copy" title="Click to copy">hardcorepvp.com</code><span class="mcver"></span></p>

  <h1>Player stats</h1>

  <header class="banner">
    <div class="alpha"><span class="year">2026</span> Alpha v0.1</div>
    <nav><a href="/">Home</a><a href="/news.html">News</a><a href="/stats.html">Stats</a><a href="/kits.html">Kits</a><a href="/faq.html">FAQ</a></nav>
  </header>
  <div id="page" class="panel">Loading…</div>

  <script>
    const avg = (kills, games) => games ? (kills / games).toFixed(2) : '0.00';
    const pct = (wins, games) => games ? Math.round(100 * wins / games) + '%' : '0%';

    function lastOnline(p, onlineNames) {
      if (onlineNames.includes(p.name)) return '<span class="playing">Playing now</span>';
      if (!p.lastSeen) return 'unknown';
      const hours = Math.floor((Date.now() - p.lastSeen) / 3600000);
      if (hours < 1) return 'less than an hour ago';
      if (hours < 24) return hours + 'h ago';
      return Math.floor(hours / 24) + 'd ago';
    }

    (async () => {
      const el = document.getElementById('page');
      const name = new URLSearchParams(location.search).get('name') || '';
      if (!name) {
        el.innerHTML = 'No player given. <a href="/stats.html">Search for one.</a>';
        return;
      }
      document.title = 'Minecraft Hardcore Games: ' + name;

      const res = await fetch('/api/stats?player=' + encodeURIComponent(name));
      if (!res.ok) {
        el.textContent = 'No stats for "' + name + '". They may not have played a match yet.';
        return;
      }
      const p = await res.json();

      let onlineNames = [];
      try {
        onlineNames = (await (await fetch('/api/status')).json()).onlineNames || [];
      } catch {}

      let names = {};
      try {
        for (const k of await (await fetch('/api/kits')).json()) names[k.id] = k.name;
      } catch {}
      names.none = 'None';

      const statRow = (label, value) =>
          '<div class="stat-row"><span>' + label + '</span><b>' + value + '</b></div>';

      let html = '<div class="player-header">';
      html += '<div class="player-identity">'
            + '<div class="player-name">' + p.name + '</div>'
            + '<img class="skin" src="https://mc-heads.net/body/' + encodeURIComponent(p.name)
            + '/140" alt="" onerror="this.style.display=\'none\'">'
            + '</div>';
      html += '<div class="player-totals">'
            + statRow('Wins', p.wins)
            + statRow('Kills', p.kills)
            + statRow('Games', p.games)
            + statRow('Kills/game', avg(p.kills, p.games))
            + statRow('Win rate', pct(p.wins, p.games))
            + statRow('Win streak', p.streak || 0)
            + statRow('Longest streak', p.bestStreak || 0)
            + statRow('Last online', lastOnline(p, onlineNames))
            + '</div>';
      html += '</div>';

      const kits = Object.entries(p.kits || {})
          .sort((a, b) => b[1].games - a[1].games || b[1].kills - a[1].kills);
      if (kits.length) {
        html += '<h2>Kits</h2>';
        // data-label lets the stylesheet stack each row into a card on narrow screens.
        const cell = (label, value) => '<td data-label="' + label + '">' + value + '</td>';
        html += '<table class="kit-table"><thead><tr><th>Kit</th><th>Games</th>'
              + '<th>Wins</th><th>Kills</th><th>Kills/game</th><th>Win rate</th></tr></thead><tbody>';
        for (const [id, k] of kits) {
          html += '<tr>' + cell('Kit', names[id] || id) + cell('Games', k.games)
                + cell('Wins', k.wins) + cell('Kills', k.kills)
                + cell('Kills/game', avg(k.kills, k.games))
                + cell('Win rate', pct(k.wins, k.games)) + '</tr>';
        }
        html += '</tbody></table>';
      }
      // No kit data yet: show nothing rather than an apology.
      el.outerHTML = '<div>' + html + '</div>';
    })();
  </script>

  <script>
    // The Minecraft version next to the address, same as on the homepage.
    fetch('/api/status').then((r) => r.json()).then((s) => {
      if (s.version) document.querySelector('.mcver').textContent = ' \u00b7 MC v' + s.version;
    }).catch(() => {});

    // Click the address to copy it, same as on the homepage.
    document.querySelectorAll('.ip code').forEach((ip) => {
      const text = ip.textContent;
      ip.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(text); } catch { return; }
        ip.textContent = 'Copied!';
        setTimeout(() => { ip.textContent = text; }, 1200);
      });
    });
  </script>
</main>
</body>
</html>
