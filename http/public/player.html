    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hardcorepvp.com/player.html" />

  <title>Minecraft Hardcore Games: Player</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/style.css?v=84">
  <!-- loaded before the page script below: it draws the platform logos in the movie list -->
  <script src="/site.js?v=2"></script>
</head>
<body class="swords">
<main>
  <p class="ip">IP: <code class="ip-copy" title="Click to copy">hardcorepvp.com</code><span class="mcver"></span></p>

  <h1>Player stats</h1>

  <header class="banner">
    <div class="alpha"><span class="year">2026</span> Alpha v0.1</div>
    <nav><a href="/">Home</a><a href="/stats.html">Stats</a><a href="/news.html">News</a><a href="/kits.html">Kits</a><a href="/faq.html">FAQ</a><a href="https://www.youtube.com/@hardcorepvpcom/shorts" target="_blank" rel="noopener">Watch</a><a href="https://discord.gg/78AUNtv42z" target="_blank" rel="noopener">Discord</a></nav>
  </header>
  <div id="page" class="panel">Loading…</div>

  <script>
    const avg = (kills, games) => games ? (kills / games).toFixed(2) : '0.00';
    const pct = (wins, games) => games ? Math.round(100 * wins / games) + '%' : '0%';

    function lastOnline(p, onlineNames) {
      if (onlineNames.includes(p.name)) return '<span class="playing">Playing now</span>';
      if (!p.lastSeen) return 'unknown';
      const hours = Math.floor((Date.now() - p.lastSeen) / 3600000);
      if (hours < 1) return 'less than an hour ago';
      if (hours < 24) return hours + 'h ago';
      return Math.floor(hours / 24) + 'd ago';
    }

    (async () => {
      const el = document.getElementById('page');
      const name = new URLSearchParams(location.search).get('name') || '';
      if (!name) {
        el.innerHTML = 'No player given. <a href="/stats.html">Search for one.</a>';
        return;
      }
      document.title = 'Minecraft Hardcore Games: ' + name;

      // A player with no match stats yet can still be in films (a staged story, a spectator
      // the camera caught), so the page goes on without the numbers.
      const res = await fetch('/api/stats?player=' + encodeURIComponent(name));
      const p = res.ok ? await res.json() : { name, wins: 0, kills: 0, games: 0, kits: {}, noStats: true };

      let onlineNames = [];
      try {
        onlineNames = (await (await fetch('/api/status')).json()).onlineNames || [];
      } catch {}

      let names = {};
      try {
        for (const k of await (await fetch('/api/kits')).json()) names[k.id] = k.name;
      } catch {}
      names.none = 'None';

      const statRow = (label, value) =>
          '<div class="stat-row"><span>' + label + '</span><b>' + value + '</b></div>';

      let html = '<div class="player-header">';
      html += '<div class="player-identity">'
            + '<div class="player-name">' + p.name + '</div>'
            + '<img class="skin" src="https://mc-heads.net/body/' + encodeURIComponent(p.name)
            + '/140" alt="" onerror="this.style.display=\'none\'">'
            + '</div>';
      html += p.noStats ? '<div class="player-totals"><p class="muted">No match stats yet. They may not have played a match.</p></div>' : ('<div class="player-totals">'
            + statRow('Wins', p.wins)
            + statRow('Kills', p.kills)
            + statRow('Games', p.games)
            + statRow('Kills/game', avg(p.kills, p.games))
            + statRow('Win rate', pct(p.wins, p.games))
            + statRow('Win streak', p.streak || 0)
            + statRow('Longest streak', p.bestStreak || 0)
            + statRow('Last online', lastOnline(p, onlineNames))
            + '</div>');
      html += '</div>';

      const kits = Object.entries(p.kits || {})
          .sort((a, b) => b[1].games - a[1].games || b[1].kills - a[1].kills);
      let kitsHtml = '';
      if (kits.length) {
        // data-label lets the stylesheet stack each row into a card on narrow screens.
        const cell = (label, value) => '<td data-label="' + label + '">' + value + '</td>';
        kitsHtml += '<table class="kit-table"><thead><tr><th>Kit</th><th>Games</th>'
              + '<th>Wins</th><th>Kills</th><th>Kills/game</th><th>Win rate</th></tr></thead><tbody>';
        for (const [id, k] of kits) {
          kitsHtml += '<tr>' + cell('Kit', names[id] || id) + cell('Games', k.games)
                + cell('Wins', k.wins) + cell('Kills', k.kills)
                + cell('Kills/game', avg(k.kills, k.games))
                + cell('Win rate', pct(k.wins, k.games)) + '</tr>';
        }
        kitsHtml += '</tbody></table>';
      }

      // Every movie this player appears in (the film pipeline records who is in each one).
      let moviesHtml = '';
      let movieCount = 0;
      try {
        const films = await (await fetch('/api/films?player=' + encodeURIComponent(name))).json();
        if (Array.isArray(films) && films.length) {
          movieCount = films.length;
          const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          // One row per film. With more than one place to watch (the shared site.js says which
          // are live), three logo buttons pick the platform: the titles then lead there, and
          // films that are not up on it yet step aside.
          const S = window.HG_SOCIAL || { youtube: 'x' };
          const NAMES = window.HG_SOCIAL_NAMES || { youtube: 'YouTube', instagram: 'Instagram', tiktok: 'TikTok' };
          const icon = (k) => (typeof window.hgSocialIcon === 'function' ? window.hgSocialIcon(k) : '');
          const platforms = ['youtube', 'instagram', 'tiktok'].filter((k) => S[k] || films.some((f) => f.links && f.links[k]));
          if (platforms.length > 1) {
            moviesHtml += '<div class="film-filter" role="group" aria-label="Where to watch">'
              + platforms.map((k, i) => '<button type="button" class="film-platform' + (i === 0 ? ' is-on' : '') + '" data-platform="' + k + '" aria-pressed="' + (i === 0) + '" title="' + NAMES[k] + '">'
                + icon(k) + '<span>' + NAMES[k] + '</span></button>').join('')
              + '</div>';
          }
          moviesHtml += '<ul class="film-list">';
          for (const f of films) {
            const day = f.published ? new Date(f.published).toLocaleDateString() : '';
            const links = f.links || { youtube: f.url };
            moviesHtml += '<li' + platforms.map((k) => links[k] ? ' data-' + k + '="' + esc(links[k]) + '"' : '').join('') + '>'
                  + '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.title) + '</a>'
                  + '<span class="muted">' + (f.kind === 'match' ? 'match' : 'story') + (f.short ? ' short' : '')
                  + (day ? ' · ' + day : '') + '</span></li>';
          }
          moviesHtml += '</ul><p class="film-none film-none-here" hidden>None on this one yet.</p>';
        }
      } catch { /* no movie list: the profile is still complete without it */ }
      if (!moviesHtml) {
        moviesHtml = '<p class="film-none">None yet. Play some matches and use <code>/highlight</code> during critical moments.</p>';
      }

      // Kits and movies. With both, a phone gets two buttons that switch between them (no
      // scrolling past one to reach the other) and a wide screen shows them side by side.
      // A player with no kit games yet just gets the Movies section.
      const pane = (id, title, body, on) =>
          '<section class="profile-pane' + (on ? ' is-on' : '') + '" data-pane="' + id + '"><h2>' + title + '</h2>' + body + '</section>';
      if (kitsHtml) {
        html += '<div class="profile-tabs" role="tablist">'
              + '<button type="button" class="mc-button profile-tab is-on" data-tab="kits" role="tab" aria-selected="true">Kits</button>'
              + '<button type="button" class="mc-button profile-tab" data-tab="movies" role="tab" aria-selected="false">Movies (' + movieCount + ')</button>'
              + '</div>'
              + '<div class="profile-panes both">' + pane('kits', 'Kits', kitsHtml, true) + pane('movies', 'Movies', moviesHtml, false) + '</div>';
      } else {
        html += '<div class="profile-panes">' + pane('movies', 'Movies', moviesHtml, true) + '</div>';
      }
      el.outerHTML = '<div>' + html + '</div>';

      for (const b of document.querySelectorAll('.film-platform')) {
        b.addEventListener('click', () => {
          const k = b.dataset.platform;
          for (const o of document.querySelectorAll('.film-platform')) { o.classList.toggle('is-on', o === b); o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); }
          let shown = 0;
          for (const li of document.querySelectorAll('.film-list li')) {
            const href = li.getAttribute('data-' + k);
            li.hidden = !href;
            if (href) { li.querySelector('a').href = href; shown++; }
          }
          const none = document.querySelector('.film-none-here');
          if (none) none.hidden = shown > 0;
        });
      }

      for (const tab of document.querySelectorAll('.profile-tab')) {
        tab.addEventListener('click', () => {
          for (const t of document.querySelectorAll('.profile-tab')) {
            const on = t === tab;
            t.classList.toggle('is-on', on);
            t.setAttribute('aria-selected', on ? 'true' : 'false');
          }
          for (const s of document.querySelectorAll('.profile-pane')) {
            s.classList.toggle('is-on', s.dataset.pane === tab.dataset.tab);
          }
        });
      }
    })();
  </script>

  <script>
    // The Minecraft version next to the address, same as on the homepage.
    fetch('/api/status').then((r) => r.json()).then((s) => {
      if (s.version) {
        const v = document.querySelector('.mcver');
        v.textContent = ' \u00b7 MC v';
        v.appendChild(Object.assign(document.createElement('span'),
          { className: 'vernum', textContent: s.version }));
      }
    }).catch(() => {});

    // Click the address to copy it, same as on the homepage.
    document.querySelectorAll('.ip code').forEach((ip) => {
      const text = ip.textContent;
      ip.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(text); } catch { return; }
        ip.textContent = 'Copied!';
        setTimeout(() => { ip.textContent = text; }, 1200);
      });
    });
  </script>
  <footer class="site-footer">
    <a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="https://www.youtube.com/@hardcorepvpcom" target="_blank" rel="noopener">YouTube</a><a href="https://discord.gg/78AUNtv42z" target="_blank" rel="noopener">Discord</a>
    <span>Hardcore PVP is not affiliated with Mojang or Microsoft.</span>
  </footer>
</main>
</body>
</html>
