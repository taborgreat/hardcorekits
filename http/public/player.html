<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player — Minecraft Hunger Games</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav><a href="/">Home</a><a href="/kits.html">Kits</a><a href="/stats.html">Stats</a></nav>
  <div id="page" class="panel">Loading…</div>

  <script>
    const avg = (kills, games) => games ? (kills / games).toFixed(2) : '0.00';
    const pct = (wins, games) => games ? Math.round(100 * wins / games) + '%' : '0%';

    (async () => {
      const el = document.getElementById('page');
      const name = new URLSearchParams(location.search).get('name') || '';
      if (!name) {
        el.innerHTML = 'No player given. <a href="/stats.html">Search for one.</a>';
        return;
      }
      document.title = name + ' — Minecraft Hunger Games';

      const res = await fetch('/api/stats?player=' + encodeURIComponent(name));
      if (!res.ok) {
        el.textContent = 'No stats for "' + name + '" — they may not have played a match yet.';
        return;
      }
      const p = await res.json();

      let names = {};
      try {
        for (const k of await (await fetch('/api/kits')).json()) names[k.id] = k.name;
      } catch {}
      names.none = 'None';

      let html = '<h1>' + p.name + '</h1>';
      html += '<p><b>' + p.wins + '</b> wins · <b>' + p.kills + '</b> kills · <b>'
            + p.games + '</b> games · ' + avg(p.kills, p.games) + ' kills/game · '
            + pct(p.wins, p.games) + ' win rate</p>';

      const kits = Object.entries(p.kits || {})
          .sort((a, b) => b[1].games - a[1].games || b[1].kills - a[1].kills);
      if (kits.length) {
        html += '<h2>By kit</h2>';
        html += '<table><tr><th>Kit</th><th>Games</th>'
              + '<th>Wins</th><th>Kills</th><th>Kills/game</th><th>Win rate</th></tr>';
        for (const [id, k] of kits) {
          html += '<tr><td>' + (names[id] || id) + '</td><td>' + k.games + '</td><td>'
                + k.wins + '</td><td>' + k.kills + '</td><td>' + avg(k.kills, k.games)
                + '</td><td>' + pct(k.wins, k.games) + '</td></tr>';
        }
        html += '</table>';
      } else {
        html += '<p>No per-kit history yet — it starts recording from their next match.</p>';
      }
      el.outerHTML = '<div>' + html + '</div>';
    })();
  </script>
</main>
</body>
</html>
