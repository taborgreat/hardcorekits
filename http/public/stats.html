<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Wins, kills and playtime leaderboards for Minecraft Hardcore Games." />
    <link rel="canonical" href="https://hardcorepvp.com/stats.html" />
    <meta name="theme-color" content="#7fd06a" />
    <meta property="og:site_name" content="Minecraft Hardcore Games" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hardcorepvp.com/stats.html" />
    <meta property="og:title" content="Minecraft Hardcore Games: Stats" />
    <meta property="og:description" content="Wins, kills and playtime leaderboards for Minecraft Hardcore Games." />
    <meta property="og:image" content="https://hardcorepvp.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Minecraft Hardcore Games - hardcorepvp.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minecraft Hardcore Games: Stats" />
    <meta name="twitter:description" content="Wins, kills and playtime leaderboards for Minecraft Hardcore Games." />
    <meta name="twitter:image" content="https://hardcorepvp.com/og.png" />
  <title>Minecraft Hardcore Games: Player stats</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/style.css?v=71">
</head>
<body class="swords">
<main>
  <p class="ip">IP: <code class="ip-copy" title="Click to copy">hardcorepvp.com</code><span class="mcver"></span></p>

  <h1>Player stats</h1>

  <header class="banner">
    <div class="alpha"><span class="year">2026</span> Alpha v0.1</div>
    <nav><a href="/">Home</a><a href="/news.html">News</a><a href="/stats.html">Stats</a><a href="/kits.html">Kits</a><a href="/faq.html">FAQ</a></nav>
  </header>

  <form class="search" id="search">
    <input id="name" placeholder="Username" autocomplete="off" required>
    <button class="mc-button">Search</button>
  </form>
  <div id="result"></div>

  <section class="panel">
    <h2>Top players</h2>
    <div id="top" class="scroll-x">Loading…</div>
  </section>

  <script>
    function row(e, i) {
      const rank = i + 1;
      const medal = rank <= 3 ? ' class="rank-' + rank + '"' : '';
      const link = '<a href="/player.html?name=' + encodeURIComponent(e.name) + '">'
          + e.name + '</a>';
      return '<tr' + medal + '><td>' + rank + '</td><td>' + link + '</td><td>' + e.wins
          + '</td><td>' + e.kills + '</td><td>' + e.games + '</td></tr>';
    }
    function table(rows) {
      return '<table><tr><th></th><th>Player</th><th>Wins</th>'
          + '<th>Kills</th><th>Games</th></tr>' + rows + '</table>';
    }

    document.getElementById('search').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const out = document.getElementById('result');
      const name = document.getElementById('name').value.trim();
      const res = await fetch('/api/stats?player=' + encodeURIComponent(name));
      if (res.ok) {
        location.href = '/player.html?name=' + encodeURIComponent((await res.json()).name);
      } else {
        out.innerHTML = '<p>No stats for "' + name
            + '". They may not have played a match yet.</p>';
      }
    });

    (async () => {
      const el = document.getElementById('top');
      try {
        const top = await (await fetch('/api/stats/top')).json();
        el.innerHTML = top.length ? table(top.slice(0, 10).map(row).join(''))
                                  : '<p>Nobody has finished a match yet.</p>';
      } catch {
        el.textContent = 'Could not load the leaderboard.';
      }
    })();
  </script>

  <script>
    // The Minecraft version next to the address, same as on the homepage.
    fetch('/api/status').then((r) => r.json()).then((s) => {
      if (s.version) {
        const v = document.querySelector('.mcver');
        v.textContent = ' \u00b7 MC v';
        v.appendChild(Object.assign(document.createElement('span'),
          { className: 'vernum', textContent: s.version }));
      }
    }).catch(() => {});

    // Click the address to copy it, same as on the homepage.
    document.querySelectorAll('.ip code').forEach((ip) => {
      const text = ip.textContent;
      ip.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(text); } catch { return; }
        ip.textContent = 'Copied!';
        setTimeout(() => { ip.textContent = text; }, 1200);
      });
    });
  </script>
</main>
</body>
</html>
